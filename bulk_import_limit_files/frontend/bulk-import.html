<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PC 부품 대량 수집</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        header {
            padding: 28px;
            color: white;
            text-align: center;
            background: #111827;
        }

        main {
            width: min(1000px, 94%);
            margin: 25px auto;
        }

        nav {
            margin-bottom: 18px;
        }

        nav a {
            margin-right: 15px;
            color: #2563eb;
            text-decoration: none;
        }

        .card {
            margin-bottom: 20px;
            padding: 22px;
            background: white;
            border-radius: 12px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .row {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            font-family: monospace;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: #2563eb;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            background: #9ca3af;
        }

        .notice {
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            background: #fff7ed;
            line-height: 1.7;
        }

        #result {
            display: none;
        }

        .summary {
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            line-height: 1.9;
        }

        .result-item {
            padding: 13px 0;
            border-bottom: 1px solid #e5e7eb;
            line-height: 1.6;
        }

        .success {
            color: #15803d;
        }

        .failure {
            color: #b91c1c;
        }

        a.source {
            color: #2563eb;
            word-break: break-all;
        }

        .field-help {
            margin-top: 6px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <header>
        <h1>PC 부품 대량 자동 수집</h1>

        <p>
            목록 페이지를 따라가며 여러 상품을 저장합니다.
        </p>
    </header>

    <main>
        <nav>
            <a href="/app">직접 견적</a>
            <a href="/recommend">자동 추천</a>
            <a href="/admin">부품 관리</a>
            <a href="/import">개별 수집</a>
        </nav>

        <section class="card">
            <div class="notice">
                상품이 여러 개 나오는 공개 목록 페이지 주소를
                입력하세요. 최대 100개 목록 페이지와 1,000개 상품까지
                요청할 수 있습니다. 상품 수가 많을수록 수집 시간이 길어지며,
                쿠팡·네이버 쇼핑처럼 접근을 제한하거나 자바스크립트로만
                표시하는 사이트는 실패할 수 있습니다.
            </div>

            <div class="row">
                <div>
                    <label for="category">
                        부품 종류
                    </label>

                    <select id="category">
                        <option value="cpu">CPU</option>

                        <option value="motherboard">
                            메인보드
                        </option>

                        <option value="ram">RAM</option>

                        <option value="gpu">
                            그래픽카드
                        </option>

                        <option value="case">케이스</option>
                        <option value="psu">파워</option>
                        <option value="cooler">쿨러</option>

                        <option value="storage">
                            저장장치
                        </option>
                    </select>
                </div>

                <div>
                    <label for="max-pages">
                        최대 목록 페이지
                    </label>

                    <input
                        id="max-pages"
                        type="number"
                        min="1"
                        max="100"
                        value="20"
                    >

                    <div class="field-help">
                        입력 범위: 1~100페이지
                    </div>
                </div>

                <div>
                    <label for="max-products">
                        최대 상품 수
                    </label>

                    <input
                        id="max-products"
                        type="number"
                        min="1"
                        max="1000"
                        value="500"
                    >

                    <div class="field-help">
                        입력 범위: 1~1,000개
                    </div>
                </div>

                <div>
                    <label for="admin-key">
                        관리자 키
                    </label>

                    <input
                        id="admin-key"
                        type="password"
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <label for="urls">
                상품 목록 페이지 주소
            </label>

            <textarea
                id="urls"
                placeholder="목록 페이지 주소를 한 줄에 하나씩 입력"
            ></textarea>

            <button
                id="start-button"
                type="button"
            >
                대량 수집 시작
            </button>
        </section>

        <section
            id="result"
            class="card"
        >
            <h2>수집 결과</h2>

            <div
                id="summary"
                class="summary"
            ></div>

            <div id="result-list"></div>
        </section>
    </main>

    <script>
        const startButton =
            document.getElementById("start-button");

        const resultSection =
            document.getElementById("result");

        function formatPrice(value) {
            if (typeof value !== "number") {
                return "";
            }

            return `${value.toLocaleString("ko-KR")}원`;
        }

        function escapeHtml(value) {
            const element =
                document.createElement("div");

            element.textContent = String(value);
            return element.innerHTML;
        }

        async function startBulkImport() {
            const urls = document
                .getElementById("urls")
                .value
                .split("\n")
                .map(value => value.trim())
                .filter(Boolean);

            const category =
                document.getElementById(
                    "category"
                ).value;

            const maxPages = Number(
                document.getElementById(
                    "max-pages"
                ).value
            );

            const maxProducts = Number(
                document.getElementById(
                    "max-products"
                ).value
            );

            const adminKey =
                document.getElementById(
                    "admin-key"
                ).value;

            if (urls.length === 0) {
                alert("목록 페이지 주소를 입력하세요.");
                return;
            }

            if (!adminKey) {
                alert("관리자 키를 입력하세요.");
                return;
            }

            if (
                !Number.isInteger(maxPages)
                || maxPages < 1
                || maxPages > 100
            ) {
                alert(
                    "최대 목록 페이지는 " +
                    "1~100 사이의 정수로 입력하세요."
                );
                return;
            }

            if (
                !Number.isInteger(maxProducts)
                || maxProducts < 1
                || maxProducts > 1000
            ) {
                alert(
                    "최대 상품 수는 " +
                    "1~1,000 사이의 정수로 입력하세요."
                );
                return;
            }

            startButton.disabled = true;
            startButton.textContent =
                "상품을 수집하고 있습니다...";

            try {
                const response = await fetch(
                    "/imports/bulk",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "X-Admin-Key":
                                adminKey
                        },

                        body: JSON.stringify({
                            category,
                            urls,
                            max_pages: maxPages,
                            max_products: maxProducts
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail ??
                        "대량 수집에 실패했습니다."
                    );
                }

                resultSection.style.display = "block";

                document.getElementById(
                    "summary"
                ).innerHTML = `
                    확인한 목록 페이지:
                    ${data.visited_pages}개<br>

                    발견한 상품:
                    ${data.discovered_products}개<br>

                    새로 추가:
                    ${data.created}개<br>

                    기존 상품 갱신:
                    ${data.updated}개<br>

                    상품 처리 실패:
                    ${data.failed}개<br>

                    목록 페이지 실패:
                    ${data.page_failed}개
                `;

                const resultList =
                    document.getElementById(
                        "result-list"
                    );

                resultList.innerHTML = "";

                for (const item of data.results) {
                    const container =
                        document.createElement("div");

                    container.className =
                        "result-item";

                    const isSuccess =
                        item.status === "created"
                        || item.status === "updated";

                    const statusClass =
                        isSuccess
                            ? "success"
                            : "failure";

                    const name = escapeHtml(
                        item.model_name
                        ?? "상품 정보 없음"
                    );

                    const message = escapeHtml(
                        item.message
                    );

                    const price =
                        formatPrice(item.price);

                    const safeUrl = escapeHtml(
                        item.url
                    );

                    container.innerHTML = `
                        <strong class="${statusClass}">
                            ${message}
                        </strong>
                        <br>

                        ${name}
                        ${price ? ` · ${price}` : ""}
                        <br>

                        <a
                            class="source"
                            href="${safeUrl}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            원본 상품 페이지
                        </a>
                    `;

                    resultList.appendChild(container);
                }
            } catch (error) {
                alert(error.message);
            } finally {
                startButton.disabled = false;
                startButton.textContent =
                    "대량 수집 시작";
            }
        }

        startButton.addEventListener(
            "click",
            startBulkImport
        );
    </script>
</body>
</html>
